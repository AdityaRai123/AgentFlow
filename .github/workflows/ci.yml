name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # The suite is deliberately offline: scrapers are tested against
        # fixtures and every credential-dependent path falls back. No API
        # keys are set here, so a test that silently needs one will fail.
        env:
          DEBUG: "false"
          DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
          CHROMA_PERSIST_DIR: "./ci_chroma"
        run: pytest -q --maxfail=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Compose reads env_file: .env, which is gitignored. Generating it
      # from the example doubles as a check that .env.example stays
      # complete enough to bring the stack up.
      - name: Create .env from example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -t agentflow-backend:ci ./backend
