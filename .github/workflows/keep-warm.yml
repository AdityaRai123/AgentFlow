name: Keep backend warm

# Render's free tier sleeps after ~15 min idle, so the first visitor waits
# ~60s for a cold start. Pinging every 10 minutes keeps the demo instant.
# Set the BACKEND_URL repository variable (Settings -> Secrets and variables
# -> Actions -> Variables), e.g. https://agentflow-api.onrender.com
# GitHub pauses scheduled workflows after 60 days without repo activity.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 10 \
            "${{ vars.BACKEND_URL }}/api/monitoring/health"
